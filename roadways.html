<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कानपुरिया रोडवेज</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100vh;
      overflow: hidden;
      background: #05080c;
      color: #fff;
      font-family: sans-serif;
      position: relative;
    }

    /* आसमान और कड़कती बिजली */
    #sky {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 55vh;
      background: linear-gradient(to bottom, #020305, #0d1520);
      z-index: 1;
    }
    #lightning {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      opacity: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.05s ease;
    }
    .flash { opacity: 1 !important; }

    /* तेज बारिश */
    #rain-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }
    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.8));
      width: 2px;
      height: 28px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-30px) translateX(0) rotate(-15deg); }
      100% { transform: translateY(100vh) translateX(-120px) rotate(-15deg); }
    }

    /* हवा से हिलते पेड़ */
    .tree-line {
      position: absolute;
      bottom: 45vh;
      width: 100%;
      height: 90px;
      display: flex;
      justify-content: space-around;
      z-index: 4;
    }
    .tree {
      width: 0; height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-bottom: 75px solid #14381a;
      position: relative;
      transform-origin: bottom center;
      animation: sway 1.5s ease-in-out infinite alternate;
    }
    @keyframes sway {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-8deg); }
    }

    /* सड़क */
    #road {
      position: absolute;
      bottom: 0; width: 100%; height: 45vh;
      background: #181818;
      border-top: 5px solid #333;
      z-index: 5;
      overflow: hidden;
    }
    .lane-mark {
      position: absolute;
      top: 50%;
      width: 60px; height: 6px;
      background: #f1c40f;
      animation: roadMove 0.6s linear infinite;
    }
    @keyframes roadMove {
      0% { left: 100%; }
      100% { left: -80px; }
    }

    /* बस और सवारियां (Proper Positioned Bus) */
    .bus {
      position: absolute;
      bottom: 60px; left: 30px;
      width: 240px; height: 100px;
      background: #c0392b;
      border-radius: 12px 25px 4px 4px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .bus-top {
      position: absolute; top: 0; width: 100%; height: 14px;
      background: #f1c40f; border-radius: 12px 25px 0 0;
    }
    .windows {
      position: absolute; top: 24px; left: 15px;
      display: flex; gap: 8px;
    }
    .window {
      width: 42px; height: 35px;
      background: #5dade2;
      border: 2px solid #222;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .passenger {
      position: absolute; bottom: 0; left: 12px;
      width: 16px; height: 20px;
      background: #111;
      border-radius: 8px 8px 0 0;
    }
    .passenger::before {
      content: ''; position: absolute; top: -7px; left: 3px;
      width: 10px; height: 10px; background: #111; border-radius: 50%;
    }
    .headlight {
      position: absolute; bottom: 15px; right: 0;
      width: 12px; height: 18px; background: #fff;
      box-shadow: 35px 0 60px 25px rgba(255, 255, 255, 0.95);
    }
    .wheel {
      position: absolute; bottom: -14px;
      width: 36px; height: 36px; background: #222;
      border: 4px solid #888; border-radius: 50%;
      animation: spin 0.25s linear infinite;
    }
    .wheel.front { right: 25px; }
    .wheel.back { left: 25px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* गाड़ियां (Proper Traffic) */
    .traffic {
      position: absolute;
      bottom: 40px;
      z-index: 9;
      animation: drive linear infinite;
    }
    .car {
      width: 85px; height: 35px; background: #2980b9;
      border-radius: 8px 12px 2px 2px;
    }
    .auto {
      width: 60px; height: 42px; background: #f39c12;
      border-radius: 4px 8px 0 0;
    }
    .bike {
      width: 40px; height: 25px; background: #e74c3c;
      border-radius: 4px;
    }
    @keyframes drive {
      0% { left: -100px; }
      100% { left: 110vw; }
    }

    /* हेडर और सिर्फ ऑडियो म्यूजिक प्लेयर (Video Hidden) */
    #top-bar {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 90%; max-width: 360px;
      background: rgba(10, 15, 25, 0.92);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 15px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }
    h1.title {
      font-size: 22px;
      color: #f1c40f;
      margin-bottom: 8px;
    }
    .horn-btn {
      background: #e74c3c; color: #fff; border: none;
      padding: 8px 16px; font-weight: bold; border-radius: 20px;
      cursor: pointer; margin-bottom: 10px; font-size: 13px;
    }
    /* Video Hide Hack for Clean Audio Feel */
    .yt-audio-only {
      width: 100%; height: 50px;
      border-radius: 8px; overflow: hidden;
      background: #111;
      position: relative;
    }
    .yt-audio-only iframe {
      width: 100%; height: 200px;
      margin-top: -100px; /* Hides video frame, keeps controls active */
      border: none;
    }

    /* स्टार्टअप स्क्रीन */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #080a0f;
      z-index: 100; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
    }
    #start-overlay h2 { font-size: 28px; color: #f1c40f; margin-bottom: 10px; }
    .start-btn {
      padding: 12px 28px; font-size: 16px; font-weight: bold;
      color: #fff; background: #e74c3c;
      border: none; border-radius: 25px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h2>कानपुरिया रोडवेज</h2>
    <p style="margin-bottom:20px; color:#aaa;">सफर चालू करने के लिए बटन दबाएं</p>
    <button class="start-btn" onclick="startJourney()">START JOURNEY (चालू करें)</button>
  </div>

  <div id="sky"></div>
  <div id="lightning"></div>
  <div id="rain-canvas"></div>

  <div class="tree-line">
    <div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
  </div>

  <div id="road">
    <div class="lane-mark" style="left:10%;"></div>
    <div class="lane-mark" style="left:50%;"></div>
    <div class="lane-mark" style="left:90%;"></div>
    
    <!-- Bus with Passengers -->
    <div class="bus">
      <div class="bus-top"></div>
      <div class="windows">
        <div class="window"><div class="passenger"></div></div>
        <div class="window"><div class="passenger"></div></div>
        <div class="window"><div class="passenger"></div></div>
        <div class="window"><div class="passenger"></div></div>
      </div>
      <div class="headlight"></div>
      <div class="wheel back"></div>
      <div class="wheel front"></div>
    </div>

    <div id="traffic-container"></div>
  </div>

  <div id="top-bar">
    <h1 class="title">कानपुरिया रोडवेज</h1>
    <button class="horn-btn" onclick="playPoPoHorn()">🔊 BASS HORN (पो-पो)</button>
    
    <!-- Audio-Only View Player -->
    <div class="yt-audio-only">
      <iframe src="https://www.youtube.com/embed/videoseries?list=PLq-bT4s33RYADNkcClDkLPovaKJx0HTDM&autoplay=1" allow="autoplay"></iframe>
    </div>
  </div>

  <script>
    // तेज बारिश
    const rainContainer = document.getElementById('rain-canvas');
    for (let i = 0; i < 160; i++) {
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = Math.random() * 100 + 'vw';
      drop.style.animationDuration = (Math.random() * 0.3 + 0.2) + 's';
      drop.style.animationDelay = (Math.random() * 2) + 's';
      rainContainer.appendChild(drop);
    }

    // बिजली कड़कना
    setInterval(() => {
      if (Math.random() > 0.4) {
        const flash = document.getElementById('lightning');
        flash.classList.add('flash');
        playThunderSound();
        setTimeout(() => flash.classList.remove('flash'), 100);
      }
    }, 3500);

    // ट्रैफिक
    function spawnTraffic() {
      const container = document.getElementById('traffic-container');
      const types = ['car', 'auto', 'bike'];
      const chosen = types[Math.floor(Math.random() * types.length)];
      
      const vehicle = document.createElement('div');
      vehicle.className = `traffic ${chosen}`;
      vehicle.style.animationDuration = (Math.random() * 3 + 4) + 's';
      
      container.appendChild(vehicle);
      setTimeout(() => vehicle.remove(), 7000);
    }
    setInterval(spawnTraffic, 4000);

    function startJourney() {
      document.getElementById('start-overlay').style.display = 'none';
      playPoPoHorn();
    }

    function playPoPoHorn() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch(e){}
    }

    function playThunderSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(60, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 1.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch(e){}
    }
  </script>
</body>
</html>
