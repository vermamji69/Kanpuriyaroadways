<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कानपुरिया रोडवेज</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080c10;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    /* Background & Lightning */
    #sky {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 60vh;
      background: linear-gradient(to bottom, #020406, #111a24);
      z-index: 1;
    }
    #lightning {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.85);
      opacity: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.05s ease;
    }
    .flash { opacity: 1 !important; }

    /* Heavy Rain */
    #rain-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }
    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.7));
      width: 2px;
      height: 25px;
      opacity: 0.7;
      animation: fall linear infinite;
      transform: rotate(-15deg); /* Slanted by wind */
    }
    @keyframes fall {
      0% { transform: translateY(-30px) translateX(0) rotate(-15deg); }
      100% { transform: translateY(100vh) translateX(-100px) rotate(-15deg); }
    }

    /* Trees with Wind Animation */
    .tree-line {
      position: absolute;
      bottom: 35vh;
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: space-around;
      z-index: 4;
    }
    .tree {
      width: 0; height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 60px solid #143319;
      position: relative;
      transform-origin: bottom center;
      animation: sway 2s ease-in-out infinite alternate;
    }
    .tree::after {
      content: '';
      position: absolute;
      bottom: -70px; left: -6px;
      width: 12px; height: 10px;
      background: #2b1810;
    }
    @keyframes sway {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-8deg); }
    }

    /* Road */
    #road {
      position: absolute;
      bottom: 0; width: 100%; height: 35vh;
      background: #1a1a1a;
      border-top: 5px solid #333;
      z-index: 5;
      overflow: hidden;
    }
    .lane-mark {
      position: absolute;
      top: 50%;
      width: 60px; height: 8px;
      background: #f1c40f;
      animation: roadMove 0.6s linear infinite;
    }
    @keyframes roadMove {
      0% { left: 100%; }
      100% { left: -100px; }
    }

    /* Bus Design & Passengers */
    .bus {
      position: absolute;
      bottom: 40px; left: 80px;
      width: 220px; height: 90px;
      background: #d32f2f;
      border-radius: 12px 25px 5px 5px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .bus-top {
      position: absolute; top: 0; width: 100%; height: 12px;
      background: #fbc02d; border-radius: 12px 25px 0 0;
    }
    .windows {
      position: absolute; top: 20px; left: 15px;
      display: flex; gap: 8px;
    }
    .window {
      width: 38px; height: 30px;
      background: #81d4fa;
      border: 2px solid #333;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    /* Passengers Silhouettes */
    .passenger {
      position: absolute; bottom: 0; left: 8px;
      width: 18px; height: 20px;
      background: #111;
      border-radius: 10px 10px 0 0;
    }
    .passenger::before {
      content: ''; position: absolute; top: -8px; left: 3px;
      width: 12px; height: 12px; background: #111; border-radius: 50%;
    }
    .headlight {
      position: absolute; bottom: 15px; right: 0;
      width: 12px; height: 15px; background: #fff176;
      border-radius: 0 5px 5px 0;
      box-shadow: 25px 0 40px 15px rgba(255, 235, 59, 0.8);
    }
    .wheel {
      position: absolute; bottom: -12px;
      width: 32px; height: 32px; background: #222;
      border: 4px solid #777; border-radius: 50%;
      animation: spin 0.3s linear infinite;
    }
    .wheel.front { right: 25px; }
    .wheel.back { left: 25px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Proper Scaled Traffic Vehicles */
    .traffic {
      position: absolute;
      bottom: 25px;
      z-index: 9;
      animation: drive linear infinite;
    }
    .car {
      width: 90px; height: 35px; background: #0288d1;
      border-radius: 10px 15px 3px 3px;
    }
    .auto {
      width: 60px; height: 45px; background: #fbc02d;
      border-radius: 5px 10px 0 0;
    }
    .bike {
      width: 40px; height: 25px; background: #e65100;
      border-radius: 5px;
    }
    @keyframes drive {
      0% { left: -150px; }
      100% { left: 110vw; }
    }

    /* Top Compact Header & YouTube Player */
    #top-bar {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 92%; max-width: 420px;
      background: rgba(10, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 15px;
      padding: 10px 15px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    h1.title {
      font-size: 20px;
      color: #fbc02d;
      text-shadow: 0 0 10px rgba(251, 192, 45, 0.5);
      margin-bottom: 8px;
    }
    .horn-btn {
      background: #d32f2f; color: #fff; border: none;
      padding: 6px 14px; font-weight: bold; border-radius: 20px;
      cursor: pointer; margin-bottom: 8px; font-size: 12px;
      box-shadow: 0 4px 10px rgba(211, 47, 47, 0.4);
    }
    .horn-btn:active { transform: scale(0.95); }

    /* Compact Embedded YouTube Player */
    .yt-container {
      width: 100%; height: 90px;
      border-radius: 10px; overflow: hidden;
      border: 1px solid #333;
    }
    iframe { width: 100%; height: 100%; border: none; }

    /* Overlay Start Screen */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 8, 0.95);
      z-index: 100; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
    }
    #start-overlay h2 { font-size: 28px; color: #fbc02d; margin-bottom: 10px; }
    .start-btn {
      padding: 12px 30px; font-size: 18px; font-weight: bold;
      color: #fff; background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 75, 43, 0.5);
    }
  </style>
</head>
<body>

  <!-- Overlay Screen -->
  <div id="start-overlay">
    <h2>कानपुरिया रोडवेज Express</h2>
    <p style="margin-bottom:20px; color:#aaa;">तूफानी सफर शुरू करने के लिए बटन दबाएं</p>
    <button class="start-btn" onclick="startJourney()">START JOURNEY (चालू करें)</button>
  </div>

  <!-- Environment Elements -->
  <div id="sky"></div>
  <div id="lightning"></div>
  <div id="rain-canvas"></div>

  <!-- Trees -->
  <div class="tree-line">
    <div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
  </div>

  <!-- Road & Bus -->
  <div id="road">
    <div class="lane-mark" style="top:30%;"></div>
    <div class="lane-mark" style="top:70%;"></div>
    
    <!-- Kanpuria Bus with Passengers -->
    <div class="bus">
      <div class="bus-top"></div>
      <div class="windows">
        <div class="window"><div class="passenger"></div></div>
        <div class="window"><div class="passenger"></div></div>
        <div class="window"><div class="passenger"></div></div>
        <div class="window"><div class="passenger"></div></div>
      </div>
      <div class="headlight"></div>
      <div class="wheel back"></div>
      <div class="wheel front"></div>
    </div>

    <!-- Dynamic Traffic Container -->
    <div id="traffic-container"></div>
  </div>

  <!-- Header & Compact YouTube Music Player -->
  <div id="top-bar">
    <h1 class="title">कानपुरिया रोडवेज</h1>
    <button class="horn-btn" onclick="playPoPoHorn()">🔊 BASS HORN (पो-पो)</button>
    
    <!-- Youtube Player Playlist embedded -->
    <div class="yt-container">
      <iframe src="https://www.youtube.com/embed/videoseries?list=PLq-bT4s33RYADNkcClDkLPovaKJx0HTDM&autoplay=1" allow="autoplay"></iframe>
    </div>
  </div>

  <script>
    // Generate Heavy Rain
    const rainContainer = document.getElementById('rain-canvas');
    for (let i = 0; i < 120; i++) {
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = Math.random() * 100 + 'vw';
      drop.style.animationDuration = (Math.random() * 0.3 + 0.3) + 's';
      drop.style.animationDelay = (Math.random() * 2) + 's';
      rainContainer.appendChild(drop);
    }

    // Heavy Thunder & Flash
    setInterval(() => {
      if (Math.random() > 0.5) {
        const flash = document.getElementById('lightning');
        flash.classList.add('flash');
        playThunderSound();
        setTimeout(() => flash.classList.remove('flash'), 120);
      }
    }, 4000);

    // Spawn Traffic Cars, Autos, Bikes
    function spawnTraffic() {
      const container = document.getElementById('traffic-container');
      const types = ['car', 'auto', 'bike'];
      const chosen = types[Math.floor(Math.random() * types.length)];
      
      const vehicle = document.createElement('div');
      vehicle.className = `traffic ${chosen}`;
      vehicle.style.animationDuration = (Math.random() * 3 + 4) + 's';
      
      container.appendChild(vehicle);
      setTimeout(() => vehicle.remove(), 7000);
    }
    setInterval(spawnTraffic, 3500);

    // Start Journey Function
    function startJourney() {
      document.getElementById('start-overlay').style.display = 'none';
      playPoPoHorn();
    }

    // Horn Sound Generator
    function playPoPoHorn() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch(e){}
    }

    // Thunder Sound Generator
    function playThunderSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(60, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 1.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch(e){}
    }
  </script>
</body>
</html>
