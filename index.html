<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kanpuria Roadways</title>
  <style>
    html, body {
      background-color: #02050a;
      color: white;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    /* Lightning Flash */
    .lightning-flash {
      position: fixed;
      inset: 0;
      background-color: white;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    .flash-active {
      animation: lightningBlink 0.6s ease-out;
    }
    @keyframes lightningBlink {
      0%, 100% { opacity: 0; }
      10%, 30% { opacity: 0.8; }
      20% { opacity: 0; }
    }

    /* Cloud Banner */
    .cloud-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 200px;
      z-index: 10;
      pointer-events: none;
    }
    .dipping-cloud {
      position: absolute;
      background: radial-gradient(circle, rgba(200, 230, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 60%, transparent 80%);
      border-radius: 50%;
      filter: blur(25px);
      animation: moveCloud linear infinite;
    }
    @keyframes moveCloud {
      from { transform: translateX(100vw); }
      to { transform: translateX(-150vw); }
    }
    .dc1 { width: 500px; height: 200px; top: -20px; animation-duration: 25s; }
    .dc2 { width: 600px; height: 250px; top: 10px; animation-duration: 35s; animation-delay: 8s; }

    /* Top Nav */
    .top-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }
    .live-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: bold;
      color: #ff3b3b;
      font-size: 0.8rem;
    }
    .green-dot {
      width: 8px; height: 8px;
      background-color: #ff3b3b;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .horn-trigger-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      color: white;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .horn-trigger-btn:active { background: #ffcc00; color: #000; }

    /* Player Card */
    .top-player-card {
      position: fixed;
      top: 3.8rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(15, 20, 28, 0.9);
      border: 1px solid rgba(255, 204, 0, 0.4);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      width: 88%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .player-info-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      overflow: hidden;
    }
    .disc-art {
      width: 38px;
      height: 38px;
      background: radial-gradient(circle, #333 30%, #111 70%);
      border: 2px solid #ffcc00;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .disc-spinning {
      animation: spin 2.5s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .track-meta { display: flex; flex-direction: column; overflow: hidden; }
    .song-title-text { font-weight: bold; font-size: 0.85rem; color: #ffcc00; white-space: nowrap; }
    .song-artist-text { font-size: 0.7rem; color: #ccc; }

    .player-buttons { display: flex; align-items: center; gap: 0.6rem; }
    .btn-ctrl { background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; }

    /* Heading */
    .brand-heading-hindi {
      position: fixed;
      top: 26vh;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(to bottom, #ffcc00, #ff2200);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
      z-index: 90;
      text-align: center;
      width: 100%;
    }

    /* Scenery & Road */
    .viewport-scenery {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .road-strip {
      height: 22vh;
      background: #151515;
      position: relative;
      overflow: hidden;
      border-top: 3px solid #333;
    }
    .road-dashes-moving {
      position: absolute;
      top: 45%;
      left: 0; right: -100%;
      height: 6px;
      background-image: linear-gradient(to right, #fff 50%, transparent 50%);
      background-size: 80px 100%;
      animation: moveRoad 0.4s linear infinite;
    }
    @keyframes moveRoad { from { transform: translateX(0); } to { transform: translateX(-80px); } }

    /* Bus */
    .bus-wrapper {
      position: absolute;
      bottom: 7vh;
      left: 8vw;
      width: 280px;
      height: 95px;
      background: linear-gradient(to bottom, #ffcc00 45%, #d32f2f 45%);
      border-radius: 12px 28px 8px 8px;
      z-index: 30;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .headlight-beam {
      position: absolute;
      top: 48px;
      right: -180px;
      width: 180px;
      height: 30px;
      background: linear-gradient(to right, rgba(255,255,180,0.8), transparent);
      clip-path: polygon(0 0, 100% -50%, 100% 150%, 0 100%);
    }
    .bus-front-name {
      position: absolute;
      bottom: 10px; left: 12px;
      color: white; font-weight: 900; font-size: 0.9rem; letter-spacing: 2px;
    }
    .wheels-container {
      position: absolute;
      bottom: -12px; left: 20px; right: 30px;
      display: flex; justify-content: space-between;
    }
    .bus-wheel {
      width: 34px; height: 34px;
      background-color: #111;
      border: 3px solid #555;
      border-radius: 50%;
      animation: spin 0.2s linear infinite;
    }

    .vermag-tag {
      position: fixed;
      bottom: 8px; right: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.75rem;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="lightning-flash" class="lightning-flash"></div>

  <!-- Cloud Banner -->
  <div class="cloud-banner">
    <div class="dipping-cloud dc1"></div>
    <div class="dipping-cloud dc2"></div>
  </div>

  <!-- Top Navigation -->
  <div class="top-nav">
    <div class="live-status">
      <span class="green-dot"></span>
      <span>LIVE - KANPUR EXPRESSWAY</span>
    </div>
    <button class="horn-trigger-btn" onclick="playPoPoHorn()">
      🎺 BASS HORN
    </button>
  </div>

  <!-- Player Card -->
  <div class="top-player-card">
    <div class="player-info-row">
      <div id="disc-art" class="disc-art">💿</div>
      <div class="track-meta">
        <span id="song-title-text" class="song-title-text">कानपुरिया एक्सप्रेस डीजे</span>
        <span id="song-artist-text" class="song-artist-text">Track 1 / 3</span>
      </div>
    </div>
    <div class="player-buttons">
      <button class="btn-ctrl" onclick="prevSong()">⏮</button>
      <button id="btn-play-main" class="btn-ctrl" style="font-size: 1.5rem;" onclick="togglePlay()">▶</button>
      <button class="btn-ctrl" onclick="nextSong()">⏭</button>
    </div>
  </div>

  <!-- Brand Heading -->
  <div class="brand-heading-hindi">
    कानपुरिया रोडवेज
  </div>

  <!-- Scenery & Bus -->
  <div class="viewport-scenery">
    <div class="bus-wrapper">
      <div class="headlight-beam"></div>
      <div class="bus-front-name">KANPURIA</div>
      <div class="wheels-container">
        <div class="bus-wheel"></div>
        <div class="bus-wheel"></div>
      </div>
    </div>
    <div class="road-strip">
      <div class="road-dashes-moving"></div>
    </div>
  </div>

  <div class="vermag-tag">Powered by Kanpuria Express</div>

  <!-- Audio Player -->
  <audio id="main-audio"></audio>

  <script>
    // Audio Songs List (Direct Audio Links)
    const playlist = [
      {
        title: "कानपुरिया डीजे रीमिक्स - 1",
        artist: "Kanpuria Beats",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        title: "कानपुरिया एक्सप्रेस स्पेशल - 2",
        artist: "Express Mix",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
      },
      {
        title: "रोडवेज नाईट राइड - 3",
        artist: "Bass Boosted",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
      }
    ];

    let currentTrack = 0;
    const audio = document.getElementById('main-audio');
    let isPlaying = false;

    function loadTrack(index) {
      audio.src = playlist[index].src;
      document.getElementById('song-title-text').innerText = playlist[index].title;
      document.getElementById('song-artist-text').innerText = playlist[index].artist;
    }

    // Initial load
    loadTrack(currentTrack);

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        document.getElementById('btn-play-main').innerText = "▶";
        document.getElementById('disc-art').classList.remove('disc-spinning');
        isPlaying = false;
      } else {
        audio.play().then(() => {
          document.getElementById('btn-play-main').innerText = "⏸";
          document.getElementById('disc-art').classList.add('disc-spinning');
          isPlaying = true;
        }).catch(err => {
          alert("गाना चलाने के लिए फिर से Play पर क्लिक करें!");
        });
      }
    }

    function nextSong() {
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      if (isPlaying) audio.play();
    }

    function prevSong() {
      currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrack);
      if (isPlaying) audio.play();
    }

    // Auto next when song ends
    audio.onended = function() {
      nextSong();
    };

    // Random Lightning Effect
    setInterval(() => {
      if (Math.random() > 0.6) {
        const flash = document.getElementById('lightning-flash');
        flash.classList.add('flash-active');
        setTimeout(() => flash.classList.remove('flash-active'), 600);
      }
    }, 4000);

    // BASS HORN Sound System
    function playPoPoHorn() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.35);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    }
  </script>
</body>
</html>
