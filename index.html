<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanpuria Roadways</title>
  <style>
    body { background-color: #02050a; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; height: 100vh; }
    
    /* Elements */
    .sky { position: absolute; top: 0; width: 100%; height: 60%; z-index: 1; }
    
    .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.3; filter: blur(20px); animation: move 40s linear infinite; }
    .cloud1 { width: 300px; height: 100px; top: 50px; left: -300px; }
    .cloud2 { width: 400px; height: 120px; top: 150px; left: -400px; animation-delay: 10s; }
    @keyframes move { from { left: -500px; } to { left: 100%; } }

    .player-container { position: relative; z-index: 100; display: flex; justify-content: center; padding-top: 20px; }
    
    /* YouTube Player Window */
    .music-box { background: #1a1a1a; padding: 15px; border-radius: 20px; border: 2px solid #ffcc00; width: 90%; max-width: 400px; color: white; text-align: center; }
    
    .heading { position: relative; z-index: 10; text-align: center; font-size: 3rem; color: #ffcc00; font-weight: bold; margin-top: 50px; text-shadow: 0 0 20px #ff0000; }
    
    .road-area { position: absolute; bottom: 0; width: 100%; height: 200px; background: #333; z-index: 5; }
    .bus { position: absolute; bottom: 50px; left: 10%; width: 250px; height: 80px; background: #ffcc00; border-radius: 10px; z-index: 6; }
    .bus::after { content: ''; position: absolute; right: 0; width: 50px; height: 80px; background: #d32f2f; border-radius: 0 10px 10px 0; }
  </style>
</head>
<body>

  <!-- Sky Area -->
  <div class="sky">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
  </div>

  <!-- Music Player -->
  <div class="player-container">
    <div class="music-box">
      <h3 style="margin:0;">🎵 Kanpuria Mix</h3>
      <p style="font-size: 0.8rem; color: #aaa;">प्ले करने के लिए Play बटन दबाएं</p>
      <!-- YouTube Embed Code -->
      <iframe width="100%" height="200" src="https://www.youtube.com/embed/videoseries?list=PL4fGSI1pDJn69On1f-yb1ee2f-m2fNff4" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Heading -->
  <div class="heading">कानपुरिया रोडवेज</div>

  <!-- Road -->
  <div class="road-area">
    <div class="bus"></div>
  </div>

</body>
</html>
