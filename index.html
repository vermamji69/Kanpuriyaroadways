<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kanpuria Roadways</title>
  <style>
    html, body {
      background-color: #02050a;
      color: white;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }

    /* Lightning */
    .lightning-flash {
      position: fixed;
      inset: 0;
      background-color: white;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    .lightning-flash.flash-active {
      animation: lightningBlink 0.6s ease-out;
    }
    @keyframes lightningBlink {
      0% { opacity: 0; }
      10% { opacity: 1; }
      20% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Rain */
    .rain-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      overflow: hidden;
    }
    .drop {
      position: absolute;
      top: -20px;
      width: 1px;
      height: 20px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.8));
      animation: rain linear infinite;
    }
    @keyframes rain {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }

    /* Cloud Banner */
    .cloud-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 200px;
      z-index: 15;
      pointer-events: none;
    }
    .dipping-cloud {
      position: absolute;
      background: radial-gradient(circle, rgba(200, 230, 255, 0.45) 0%, rgba(255, 255, 255, 0.25) 50%, transparent 80%);
      border-radius: 50%;
      filter: blur(35px);
      animation: moveCloud 30s linear infinite;
    }
    @keyframes moveCloud {
      from { transform: translateX(100vw); }
      to { transform: translateX(-150vw); }
    }
    .dc1 {
      width: 600px;
      height: 250px;
      top: -20px;
      left: 100%;
      animation-duration: 35s;
    }
    .dc2 {
      width: 800px;
      height: 350px;
      top: -50px;
      left: 100%;
      animation-duration: 45s;
      animation-delay: 15s;
    }
    .dc3 {
      width: 550px;
      height: 200px;
      top: 10px;
      left: 100%;
      animation-duration: 30s;
      animation-delay: 8s;
    }
    .dc4 {
      width: 900px;
      height: 400px;
      top: -80px;
      left: 100%;
      animation-duration: 50s;
      animation-delay: 25s;
    }

    /* Airplane */
    .airplane-wrapper {
      position: absolute;
      top: 12vh;
      left: 100vw;
      z-index: 14;
      animation: flyAirplane 60s linear infinite;
    }
    @keyframes flyAirplane {
      0% { transform: translateX(10vw); opacity: 0; }
      5% { transform: translateX(10vw); opacity: 0; }
      10% { transform: translateX(0); opacity: 0.8; }
      35% { transform: translateX(-150vw); opacity: 0.8; }
      40% { transform: translateX(-160vw); opacity: 0; }
      100% { transform: translateX(-160vw); opacity: 0; }
    }
    .plane-light {
      animation: strobe 1s infinite alternate;
    }
    .plane-strobe {
      animation: strobeFast 0.2s infinite alternate;
    }
    .plane-beam {
      animation: sweepBeam 4s infinite alternate ease-in-out;
      transform-origin: left center;
    }
    @keyframes strobe {
      0% { opacity: 0.2; }
      100% { opacity: 1; filter: drop-shadow(0 0 10px red); }
    }
    @keyframes strobeFast {
      0% { opacity: 0; }
      100% { opacity: 1; filter: drop-shadow(0 0 12px white); }
    }
    @keyframes sweepBeam {
      0% { transform: rotate(-5deg); opacity: 0.5; }
      100% { transform: rotate(5deg); opacity: 0.8; }
    }

    /* UI Elements */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }
    .live-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: bold;
      color: #ff3b3b;
      font-size: 0.875rem;
    }
    .green-dot {
      width: 8px;
      height: 8px;
      background-color: #ff3b3b;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .horn-trigger-btn {
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background-color 0.2s;
      color: white;
      font-weight: bold;
    }
    .horn-trigger-btn:hover {
      background-color: rgba(255,255,255,0.2);
    }

    .top-player-card {
      position: fixed;
      top: 4rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(10, 15, 20, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      width: 90%;
      max-width: 450px;
    }
    .player-info-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 0;
    }
    .disc-art {
      width: 36px;
      height: 36px;
      background: linear-gradient(45deg, #1a1a1a, #333);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 3s linear infinite;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .track-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }
    .song-title-text {
      font-weight: bold;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist-text {
      font-size: 0.75rem;
      color: #aaa;
    }
    .player-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .btn-ctrl {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0.25rem;
    }
    .btn-play-main {
      font-size: 1.5rem;
    }

    .brand-heading-hindi {
      position: fixed;
      top: 40vh;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(to bottom, #ffcc00, #ff0000);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 2px 4px 15px rgba(0,0,0,0.8);
      z-index: 100;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    /* Environment */
    .viewport-scenery {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .fog-layer {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(2,5,10,0.8) 0%, rgba(2,5,10,0) 50%, rgba(2,5,10,0.8) 100%);
      pointer-events: none;
    }

    .scenery-container {
      position: absolute;
      bottom: 25vh;
      left: 0;
      right: 0;
      height: 200px;
    }
    .scenery-item {
      position: absolute;
      bottom: 0;
      left: 100%;
      animation: moveLeft 8s linear infinite;
    }
    @keyframes moveLeft {
      from { transform: translateX(0); }
      to { transform: translateX(-200vw); }
    }

    .highway-sign-wrapper {
      position: absolute;
      bottom: 25vh;
      left: 100vw;
      z-index: 25;
      animation: moveSign 15s linear forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @keyframes moveSign {
      from { transform: translateX(0); }
      to { transform: translateX(-200vw); }
    }
    .sign-board-rect {
      background-color: #0f5132;
      border: 4px solid #fff;
      border-radius: 8px;
      padding: 1rem 2rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      color: white;
      font-weight: bold;
      min-width: 200px;
      white-space: nowrap;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }
    .sign-board-hindi {
      font-size: 1.5rem;
    }
    .sign-board-english {
      font-size: 1.25rem;
    }
    .sign-poles {
      display: flex;
      gap: 100px;
    }
    .pole-stick {
      width: 8px;
      height: 100px;
      background-color: #888;
    }

    /* Road */
    .road-strip {
      height: 25vh;
      background: linear-gradient(to bottom, #111, #222);
      position: relative;
      overflow: hidden;
      perspective: 1000px;
    }
    .road-dashes-moving {
      position: absolute;
      top: 50%;
      left: 0;
      right: -100%;
      height: 4px;
      background-image: linear-gradient(to right, white 50%, transparent 50%);
      background-size: 100px 100%;
      animation: moveRoad 0.5s linear infinite;
    }
    @keyframes moveRoad {
      from { transform: translateX(0); }
      to { transform: translateX(-100px); }
    }

    /* Bus */
    .bus-wrapper {
      position: absolute;
      bottom: 10vh;
      left: 10vw;
      width: 380px;
      height: 130px;
      background: linear-gradient(to bottom, #ffcc00 40%, #d32f2f 40%);
      border-radius: 15px 40px 10px 10px;
      z-index: 30;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 -5px 15px rgba(0,0,0,0.2);
    }
    .bus-roof-luggage {
      position: absolute;
      top: -20px;
      left: 30px;
      width: 280px;
      height: 20px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      z-index: 29;
    }
    .luggage-item {
      border: 2px solid #111;
      border-radius: 4px;
      box-shadow: inset -2px -2px 5px rgba(0,0,0,0.4);
    }
    .luggage-1 { width: 35px; height: 18px; background-color: #8b4513; }
    .luggage-2 { width: 28px; height: 25px; background-color: #2b4c7e; }
    .luggage-3 { width: 45px; height: 16px; background-color: #556b2f; border-radius: 10px 10px 2px 2px; }
    .luggage-4 { width: 25px; height: 30px; background-color: #8b0000; }
    .luggage-5 { width: 38px; height: 14px; background-color: #d2691e; }
    .luggage-rack {
      position: absolute;
      top: -10px;
      left: 20px;
      width: 300px;
      height: 10px;
      border: 3px solid #333;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      z-index: 31;
    }
    .headlight-beam {
      position: absolute;
      top: 70px;
      right: -250px;
      width: 250px;
      height: 40px;
      background: linear-gradient(to right, rgba(255,255,150,0.9), transparent);
      clip-path: polygon(0 0, 100% -40%, 100% 140%, 0 100%);
      z-index: -1;
    }
    .bus-front-name {
      position: absolute;
      bottom: 15px;
      left: 20px;
      color: white;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .bus-driver-window {
      position: absolute;
      top: 15px;
      right: 20px;
      width: 60px;
      height: 50px;
      background-color: rgba(100,200,255,0.3);
      border-radius: 5px 25px 5px 5px;
      border: 2px solid #222;
      overflow: hidden;
    }
    .driver-silhouette {
      position: absolute;
      bottom: -5px;
      right: 15px;
    }
    .driver-head {
      width: 14px;
      height: 16px;
      background-color: #111;
      border-radius: 50%;
      margin-left: 2px;
    }
    .driver-body {
      width: 22px;
      height: 25px;
      background-color: #222;
      border-radius: 10px 10px 0 0;
    }
    .steering-wheel {
      position: absolute;
      right: -10px;
      bottom: 12px;
      width: 15px;
      height: 4px;
      background-color: #444;
      transform: rotate(-20deg);
    }
    .bus-windows-list {
      position: absolute;
      top: 20px;
      left: 15px;
      right: 90px;
      height: 40px;
      display: flex;
      gap: 8px;
    }
    .bus-win {
      flex: 1;
      background-color: rgba(100,200,255,0.3);
      border-radius: 4px;
      border: 2px solid #222;
      position: relative;
      overflow: hidden;
    }
    .passenger-silhouette {
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
    }
    .pass-head {
      width: 12px;
      height: 14px;
      background-color: #0a0a0a;
      border-radius: 50%;
      margin: 0 auto;
    }
    .pass-body {
      width: 20px;
      height: 20px;
      background-color: #1f1f1f;
      border-radius: 8px 8px 0 0;
    }
    .wheels-container {
      position: absolute;
      bottom: -15px;
      left: 30px;
      right: 40px;
      display: flex;
      justify-content: space-between;
    }
    .bus-wheel {
      width: 45px;
      height: 45px;
      background-color: #111;
      border: 4px solid #444;
      border-radius: 50%;
      animation: spin 0.2s linear infinite;
    }

    /* Traffic */
    .traffic-container {
      position: absolute;
      bottom: 25vh;
      left: 0;
      right: 0;
      height: 100px;
    }
    .traffic-item {
      position: absolute;
      bottom: 10px;
      left: 100%;
      animation-name: moveTraffic;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }
    @keyframes moveTraffic {
      from { transform: translateX(0); }
      to { transform: translateX(-150vw); }
    }
    .traffic-car {
      width: 60px;
      height: 30px;
      background-color: #333;
      border-radius: 10px;
    }
    .traffic-car::after {
      content: '';
      position: absolute;
      left: -5px;
      top: 5px;
      width: 10px;
      height: 10px;
      background-color: #ffffcc;
      border-radius: 50%;
      box-shadow: -30px 0 30px 15px rgba(255,255,150,0.8);
    }
    .traffic-scooter {
      width: 20px;
      height: 20px;
      background-color: #555;
      border-radius: 4px;
    }
    .scooter-light {
      position: absolute;
      left: -5px;
      top: 5px;
      width: 5px;
      height: 5px;
      background-color: #ffffcc;
      border-radius: 50%;
      box-shadow: -15px 0 15px 5px rgba(255,255,150,0.8);
    }
    .traffic-passing-car {
      width: 70px;
      height: 35px;
      background-color: #1a1a1a;
      border-radius: 10px;
      left: -20vw;
      animation-name: passingTraffic;
    }
    @keyframes passingTraffic {
      from { transform: translateX(0); }
      to { transform: translateX(150vw); }
    }
    .traffic-passing-car::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 5px;
      width: 15px;
      height: 15px;
      background-color: #ffffe0;
      border-radius: 50%;
      box-shadow: 40px 0 40px 20px rgba(255,255,150,0.9);
    }
    .traffic-passing-car::before {
      content: '';
      position: absolute;
      left: -2px;
      top: 5px;
      width: 5px;
      height: 5px;
      background-color: red;
      border-radius: 50%;
      box-shadow: -5px 0 10px red;
    }
    .traffic-person {
      width: 10px;
      height: 20px;
      background-color: #000;
      border-radius: 4px;
    }

    .vermag-tag {
      position: fixed;
      bottom: 10px;
      right: 15px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      z-index: 100;
    }

    /* Responsive Scaling for Mobile & Tablets */
    @media (max-width: 768px) {
      .top-nav {
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem;
      }
      .live-status {
        font-size: 0.75rem;
      }
      .top-player-card {
        top: 5.5rem;
        padding: 0.5rem 1rem;
        gap: 0.75rem;
        width: 95%;
      }
      .brand-heading-hindi {
        font-size: 2.2rem;
        top: 45vh;
      }
      .bus-wrapper {
        transform: scale(0.65);
        transform-origin: bottom left;
        left: 5vw;
      }
      .airplane-wrapper {
        transform: scale(0.65);
      }
      .sign-board-rect {
        transform: scale(0.7);
        transform-origin: bottom center;
      }
      .sign-poles {
        transform: scale(0.7);
        transform-origin: top center;
      }
    }

    @media (max-width: 480px) {
      .top-nav {
        flex-direction: row;
        align-items: flex-start;
        padding: 0.5rem;
      }
      .live-status {
        font-size: 0.65rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
      }
      .horn-trigger-btn {
        padding: 0.3rem 0.6rem;
        font-size: 0.75rem;
      }
      .top-player-card {
        top: 4rem;
        transform: translateX(-50%) scale(0.85);
      }
      .player-info-row {
        gap: 0.5rem;
      }
      .brand-heading-hindi {
        font-size: 1.6rem;
        top: 45vh;
      }
      .bus-wrapper {
        transform: scale(0.45);
        transform-origin: bottom left;
        left: 2vw;
      }
      .airplane-wrapper {
        transform: scale(0.45);
      }
      .sign-board-rect {
        transform: scale(0.5);
      }
      .sign-poles {
        transform: scale(0.5);
      }
      .vermag-tag {
        font-size: 0.6rem;
        bottom: 5px;
        right: 5px;
      }
    }
  </style>
</head>
<body>

  <div id="yt-player-frame"></div>
  <div id="lightning-flash" class="lightning-flash"></div>

  <!-- Rain Effect -->
  <div class="rain-canvas" id="rain-canvas"></div>

  <!-- Cloud Banner -->
  <div class="cloud-banner">
    <div class="dipping-cloud dc1"></div>
    <div class="dipping-cloud dc2"></div>
    <div class="dipping-cloud dc3"></div>
    <div class="dipping-cloud dc4"></div>
    
    <!-- Airplane -->
    <div class="airplane-wrapper">
      <svg width="200" height="80" viewBox="0 0 150 50" style="transform: scaleX(-1)">
        <path d="M10,25 L-80,60 L-80,-10 Z" fill="rgba(255,255,255,0.4)" class="plane-beam"></path>
        <path d="M20,25 L120,25 Q140,25 145,20 L145,20 Q140,15 120,15 L20,15 Q5,15 5,20 L5,20 Q5,25 20,25 Z" fill="#0f1115"></path>
        <path d="M60,20 L90,45 L100,45 L80,20 Z" fill="#0f1115"></path>
        <path d="M60,20 L90,-5 L100,-5 L80,20 Z" fill="#08090a"></path>
        <path d="M15,15 L5,0 L15,0 L25,15 Z" fill="#0f1115"></path>
        <circle cx="95" cy="45" r="3" fill="#ff3333" class="plane-light"></circle>
        <circle cx="95" cy="-5" r="3" fill="#33ff33" class="plane-light"></circle>
        <circle cx="10" cy="20" r="3" fill="#ffffff" class="plane-strobe"></circle>
      </svg>
    </div>
  </div>

  <!-- Top Navigation -->
  <div class="top-nav">
    <div class="live-status">
      <span class="green-dot"></span>
      <span>LIVE - KANPUR EXPRESSWAY</span>
    </div>
    <button class="horn-trigger-btn" onclick="playPoPoHorn()">
      🎺 BASS HORN (पो-पो)
    </button>
    <div id="clock-display"></div>
  </div>

  <!-- Top Player Card -->
  <div class="top-player-card">
    <div class="player-info-row">
      <div id="disc-art" class="disc-art" style="animation-play-state: paused;">🎵</div>
      <div class="track-meta">
        <span id="song-title-text" class="song-title-text">कानपुरिया playlist loading...</span>
        <span id="song-artist-text" class="song-artist-text">Kanpuria Roadways DJ</span>
      </div>
    </div>
    <div class="player-buttons">
      <button class="btn-ctrl" onclick="prevSong()">⏮</button>
      <button id="btn-play-main" class="btn-ctrl btn-play-main" onclick="togglePlay()">▶</button>
      <button class="btn-ctrl" onclick="nextSong()">⏭</button>
          </div>
  </div>

  <!-- Title -->
  <div class="brand-heading-hindi">कानपुरिया रोडवेज</div>

  <!-- Highway Sign Boards -->
  <div id="signboards-container"></div>

  <!-- Scenery Environment -->
  <div class="viewport-scenery">
    <div class="fog-layer"></div>
    <div class="dynamic-bg-layer"></div>

    <div id="scenery-container" class="scenery-container"></div>

    <!-- Traffic -->
    <div id="traffic-container" class="traffic-container"></div>

    <!-- Roadway -->
    <div class="road-strip">
      <div class="road-dashes-moving"></div>
    </div>

    <!-- Bus Element -->
    <div class="bus-wrapper">
      <div class="bus-roof-luggage">
        <div class="luggage-item luggage-1"></div>
        <div class="luggage-item luggage-2"></div>
        <div class="luggage-item luggage-3"></div>
        <div class="luggage-item luggage-5"></div>
        <div class="luggage-item luggage-4"></div>
        <div class="luggage-item luggage-2"></div>
        <div class="luggage-item luggage-1"></div>

  <!-- JavaScript Application Logic -->
  <script>
    let sharedAudioContext = null;
    const getAudioContext = () => {
      if (!sharedAudioContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        sharedAudioContext = new AudioContext();
      }
      if (sharedAudioContext.state === 'suspended') {
        sharedAudioContext.resume();
      }
      return sharedAudioContext;
    };

    const playThunderSound = () => {
      try {
        const ctx = getAudioContext();
        const bufferSize = ctx.sampleRate * 5.0; // 5 seconds of thunder
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        
        let lastOut = 0;
        for (let i = 0; i < bufferSize; i++) {
          let white = Math.random() * 2 - 1;
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.5;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, ctx.currentTime);
        filter.frequency.linearRampToValueAtTime(50, ctx.currentTime + 5.0);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(4.0, ctx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 5.0);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch(e) {}
    };

    const playPoPoHorn = () => {
      try {
        const ctx = getAudioContext();
        const masterGain = ctx.createGain();
        masterGain.gain.value = 0.4;
        masterGain.connect(ctx.destination);

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();

        osc1.type = 'square';
        osc2.type = 'sawtooth';
        osc2.detune.value = 15; 

        osc1.connect(masterGain);
        osc2.connect(masterGain);

        const notes = [
          [659.25, 0.15],
          [659.25, 0.15],
          [587.33, 0.15],
          [523.25, 0.15],
          [587.33, 0.15],
          [659.25, 0.20],
          [587.33, 0.20],
          [523.25, 0.40],
          [0, 0.10],
          [523.25, 0.15],
          [587.33, 0.15],
          [659.25, 0.15],
          [587.33, 0.15],
          [523.25, 0.15],
          [493.88, 0.15],
          [440.00, 0.60]
        ];

        let startTime = ctx.currentTime;
        osc1.start(startTime);
        osc2.start(startTime);

        masterGain.gain.setValueAtTime(0, startTime);

        notes.forEach(([freq, dur]) => {
          if (freq === 0) {
            masterGain.gain.setValueAtTime(0, startTime);
          } else {
            osc1.frequency.setValueAtTime(freq, startTime);
            osc2.frequency.setValueAtTime(freq, startTime);
            masterGain.gain.setValueAtTime(0, startTime);
            masterGain.gain.linearRampToValueAtTime(0.5, startTime + 0.02);
            masterGain.gain.setValueAtTime(0.5, startTime + dur - 0.02);
            masterGain.gain.linearRampToValueAtTime(0, startTime + dur);
          }
          startTime += dur;
        });

        osc1.stop(startTime);
        osc2.stop(startTime);
      } catch(e) {}
    };

    const playPassingHorn = () => {
      try {
        const ctx = getAudioContext();
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);
        const osc = ctx.createOscillator();
        
        const hornTypes = [
          { base: 450, drop: 30, type: 'sawtooth' },  
          { base: 600, drop: 50, type: 'sawtooth' },  
          { base: 300, drop: 20, type: 'square' },    
          { base: 550, drop: 40, type: 'square' },    
        ];
        const { base, drop, type } = hornTypes[Math.floor(Math.random() * hornTypes.length)];
        
        osc.type = type;
        const now = ctx.currentTime;
        
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.linearRampToValueAtTime(base - (drop * 0.5), now + 1.2);
        osc.frequency.exponentialRampToValueAtTime(base - (drop * 3), now + 1.8);
        osc.frequency.linearRampToValueAtTime(base - (drop * 4), now + 3.0);
        
        masterGain.gain.setValueAtTime(0, now);
        masterGain.gain.linearRampToValueAtTime(0.05, now + 1.0); 
        masterGain.gain.linearRampToValueAtTime(0.3, now + 1.5); 
        masterGain.gain.linearRampToValueAtTime(0, now + 3.0); 
        
        osc.connect(masterGain);
        osc.start(now);
        osc.stop(now + 3.0);
      } catch (e) {}
    };

    const KANPUR_STOPS = [
      "Jhakarkati Bus Stand / झकरकटी बस स्टैंड",
      "Tatmill Chauraha / टाटमिल चौराहा",
      "Railway Hospital / रेलवे हॉस्पिटल",
      "Ganj Shaheedan / गंज शहीदान",
      "Afeim Kothi / अफीम कोठी",
      "Anand Puri / आनंद पूरी",
      "Chawla Market / चावला मार्केट",
      "Govind Nagar / गोविंद नगर",
      "Nand Lal Chauraha / नंदलाल चौराहा",
      "Jarib Chauki / जरीब चौकी",
      "Fazalganj / फज़लगंज",
      "Fazalganj Flyover / फज़लगंज फ्लाईओवर",
      "Dada Nagar / दादा नगर",
      "Vijaynagar / विजयनगर",
      "Vijaynagar Chauraha / विजयनगर चौराहा",
      "Armapur Estate / अरमापुर एस्टेट",
      "Armapur / अरमापुर",
      "Kalpi Road / कालपी रोड",
      "Panki Industrial Area / पनकी इंडस्ट्रियल एरिया",
      "Panki Power House / पनकी पावर हाउस",
      "Panki Hanuman Mandir / पनकी हनुमान मंदिर"
    ];

    // Clock
    const updateTime = () => {
      const now = new Date();
      document.getElementById('clock-display').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    };
    updateTime();
    setInterval(updateTime, 1000);

    // Rain
    const rainCanvas = document.getElementById('rain-canvas');
    for(let i=0; i<60; i++) {
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = `${Math.random() * 100}%`;
      drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
      drop.style.animationDelay = `${Math.random() * 2}s`;
      rainCanvas.appendChild(drop);
    }

    // Lightning
    setInterval(() => {
      if (Math.random() > 0.4) {
        const flash = document.getElementById('lightning-flash');
        flash.classList.add('flash-active');
        playThunderSound();
        setTimeout(() => flash.classList.remove('flash-active'), 600);
      }
    }, 12000);

    // YouTube Audio Player
    let playerRef = null;
    let isPlaying = false;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    window.onYouTubeIframeAPIReady = () => {
      playerRef = new window.YT.Player('yt-player-frame', {
        height: '0',
        width: '0',
        playerVars: {
          listType: 'playlist',
          list: 'PLq-bT4s33RYADNkcClDkLPovaKJx0HTDM',
          autoplay: 0,
          controls: 0,
        },
        events: {
          onReady: (event) => {
            const data = event.target.getVideoData();
            if (data && data.title) {
              document.getElementById('song-title-text').innerText = data.title;
              document.getElementById('song-artist-text').innerText = data.author || 'Kanpuria Special';
            }
          },
          onStateChange: (event) => {
            const playBtn = document.getElementById('btn-play-main');
            const discArt = document.getElementById('disc-art');
            if (event.data === window.YT.PlayerState.PLAYING) {
              isPlaying = true;
              playBtn.innerText = '⏸';
              discArt.style.animationPlayState = 'running';
              const data = playerRef.getVideoData();
              if (data && data.title) {
                document.getElementById('song-title-text').innerText = data.title;
                document.getElementById('song-artist-text').innerText = data.author || 'Kanpuria Special';
              }
            } else if (event.data === window.YT.PlayerState.PAUSED) {
              isPlaying = false;
              playBtn.innerText = '▶';
              discArt.style.animationPlayState = 'paused';
            }
          },
        },
      });
    };

    function togglePlay() {
      if (playerRef) {
        if (isPlaying) playerRef.pauseVideo();
        else playerRef.playVideo();
      }
    }
    function nextSong() { if (playerRef) playerRef.nextVideo(); }
    function prevSong() { if (playerRef) playerRef.previousVideo(); }

    // Signboards Spawning
    const signboardsContainer = document.getElementById('signboards-container');
    let currentStopIndex = 0;
    setInterval(() => {
      const stopText = KANPUR_STOPS[currentStopIndex];
      currentStopIndex = (currentStopIndex + 1) % KANPUR_STOPS.length;
      const parts = stopText.split(' / ');
      
      const board = document.createElement('div');
      board.className = 'highway-sign-wrapper';
      board.innerHTML = `
        <div class="sign-board-rect">
          <span class="sign-board-hindi">${parts[1] || parts[0]}</span>
          <span class="sign-board-english">${parts[0]}</span>
        </div>
        <div class="sign-poles">
          <div class="pole-stick"></div>
          <div class="pole-stick"></div>
        </div>
      `;
      signboardsContainer.appendChild(board);
      setTimeout(() => board.remove(), 15000); 
    }, 25000);

    // Traffic Spawning
    const trafficContainer = document.getElementById('traffic-container');
    setInterval(() => {
      const types = ['car', 'scooter', 'passing-car'];
      const chosenType = types[Math.floor(Math.random() * types.length)];
      const speed = chosenType === 'passing-car' ? 3 + Math.random() * 2 : 8 + Math.random() * 6;
      
      if (chosenType === 'passing-car') playPassingHorn();

      const item = document.createElement('div');
      item.className = `traffic-item traffic-${chosenType}`;
      item.style.animationDuration = `${speed}s`;
      if (chosenType === 'scooter') {
        item.innerHTML = `<div class="scooter-light"></div>`;
      }
      trafficContainer.appendChild(item);
      setTimeout(() => item.remove(), speed * 1000);
    }, 7000);

    // Scenery Spawning
    const sceneryContainer = document.getElementById('scenery-container');
    const getScenerySVG = (type) => {
      switch(type) {
        case 'tree-green': return `<svg width="80" height="150" viewBox="0 0 100 200"><path d="M50 20 L100 130 L0 130 Z" fill="#183d1c" /><path d="M50 0 L80 90 L20 90 Z" fill="#245a2a" /><rect x="42" y="130" width="16" height="70" fill="#2d1c10" /></svg>`;
        case 'tree-flower': return `<svg width="70" height="130" viewBox="0 0 100 200"><circle cx="50" cy="80" r="50" fill="#1b4d29" /><circle cx="50" cy="50" r="40" fill="#245a2a" /><circle cx="20" cy="80" r="30" fill="#1b4d29" /><circle cx="80" cy="80" r="30" fill="#1b4d29" /><circle cx="30" cy="50" r="5" fill="#ff3333" /><circle cx="70" cy="60" r="6" fill="#ff3333" /><circle cx="45" cy="30" r="5" fill="#ff3333" /><circle cx="20" cy="70" r="4" fill="#ff3333" /><circle cx="60" cy="90" r="5" fill="#ff3333" /><circle cx="80" cy="85" r="4" fill="#ff3333" /><circle cx="50" cy="70" r="6" fill="#ff3333" /><rect x="42" y="130" width="16" height="70" fill="#2d1c10" /></svg>`;
        case 'bush': return `<svg width="50" height="60" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#183d1c" /><circle cx="20" cy="60" r="30" fill="#183d1c" /><circle cx="80" cy="60" r="30" fill="#183d1c" /></svg>`;
        case 'tree': return `<svg width="60" height="120" viewBox="0 0 100 200"><path d="M50 0 L100 150 L0 150 Z" fill="#0b170c" /><rect x="42" y="150" width="16" height="50" fill="#020203" /></svg>`;
        case 'building': return `<svg width="100" height="220" viewBox="0 0 100 200"><rect x="0" y="0" width="100" height="200" fill="#05070a" /><rect x="15" y="20" width="20" height="30" fill="#ffeb3b" opacity="0.8" /><rect x="65" y="20" width="20" height="30" fill="#0f151d" /><rect x="15" y="80" width="20" height="30" fill="#0f151d" /><rect x="65" y="80" width="20" height="30" fill="#ffeb3b" opacity="0.7" /><rect x="15" y="140" width="20" height="30" fill="#ffeb3b" opacity="0.9" /><rect x="65" y="140" width="20" height="30" fill="#0f151d" /></svg>`;
        default: return '';
      }
    };

    setInterval(() => {
      const types = ['tree-green', 'tree-flower', 'bush', 'tree', 'building', 'tree-green'];
      const chosenType = types[Math.floor(Math.random() * types.length)];
      const item = document.createElement('div');
      item.className = 'scenery-item';
      item.innerHTML = getScenerySVG(chosenType);
      sceneryContainer.appendChild(item);
      setTimeout(() => item.remove(), 8000);
    }, 2000);
  </script>
