<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kanpuria Roadways</title>
  <style>
    html, body {
      background-color: #02050a;
      color: white;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }

    /* Top Navigation */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }
    .live-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: bold;
      color: #ff3b3b;
      font-size: 0.875rem;
    }
    .green-dot {
      width: 8px;
      height: 8px;
      background-color: #ff3b3b;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .horn-trigger-btn {
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      color: white;
      font-weight: bold;
      user-select: none;
    }
    .horn-trigger-btn:active {
      transform: scale(0.95);
      background-color: rgba(255, 204, 0, 0.4);
    }

    /* Player Card */
    .top-player-card {
      position: fixed;
      top: 4.5rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(10, 15, 20, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 0.6rem 1.25rem;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 90%;
      max-width: 420px;
    }
    .player-info-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      overflow: hidden;
    }
    .disc-art {
      width: 36px;
      height: 36px;
      background: linear-gradient(45deg, #1a1a1a, #333);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .disc-spinning {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .track-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .song-title-text {
      font-weight: bold;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffcc00;
    }
    .song-artist-text {
      font-size: 0.75rem;
      color: #aaa;
    }
    .player-buttons {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn-ctrl {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
    }

    /* Heading */
    .brand-heading-hindi {
      position: fixed;
      top: 30vh;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(to bottom, #ffcc00, #ff0000);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 2px 4px 15px rgba(0,0,0,0.8);
      z-index: 90;
      letter-spacing: 0.05em;
      white-space: nowrap;
      text-align: center;
    }

    /* Viewport & Bus */
    .viewport-scenery {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .road-strip {
      height: 25vh;
      background: linear-gradient(to bottom, #111, #222);
      position: relative;
      overflow: hidden;
    }
    .road-dashes-moving {
      position: absolute;
      top: 50%;
      left: 0;
      right: -100%;
      height: 4px;
      background-image: linear-gradient(to right, white 50%, transparent 50%);
      background-size: 100px 100%;
      animation: moveRoad 0.5s linear infinite;
    }
    @keyframes moveRoad {
      from { transform: translateX(0); }
      to { transform: translateX(-100px); }
    }

    .bus-wrapper {
      position: absolute;
      bottom: 8vh;
      left: 5vw;
      width: 320px;
      height: 110px;
      background: linear-gradient(to bottom, #ffcc00 40%, #d32f2f 40%);
      border-radius: 15px 35px 10px 10px;
      z-index: 30;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .headlight-beam {
      position: absolute;
      top: 55px;
      right: -200px;
      width: 200px;
      height: 35px;
      background: linear-gradient(to right, rgba(255,255,150,0.8), transparent);
      clip-path: polygon(0 0, 100% -40%, 100% 140%, 0 100%);
      z-index: -1;
    }
    .bus-front-name {
      position: absolute;
      bottom: 12px;
      left: 15px;
      color: white;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 2px;
    }
    .wheels-container {
      position: absolute;
      bottom: -15px;
      left: 25px;
      right: 35px;
      display: flex;
      justify-content: space-between;
    }
    .bus-wheel {
      width: 40px;
      height: 40px;
      background-color: #111;
      border: 4px solid #444;
      border-radius: 50%;
      animation: spin 0.2s linear infinite;
    }

    /* Hidden YouTube Player Frame */
    #yt-hidden-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .vermag-tag {
      position: fixed;
      bottom: 10px;
      right: 15px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      font-size: 0.8rem;
      z-index: 100;
    }

    @media (max-width: 480px) {
      .top-player-card {
        top: 4rem;
        width: 92%;
      }
      .brand-heading-hindi {
        font-size: 1.8rem;
        top: 32vh;
      }
      .bus-wrapper {
        transform: scale(0.75);
        transform-origin: bottom left;
        left: 2vw;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <div class="live-status">
      <span class="green-dot"></span>
      <span>LIVE - KANPUR EXPRESSWAY</span>
    </div>
    <button class="horn-trigger-btn" onclick="playPoPoHorn()">
      🎺 BASS HORN
    </button>
  </div>

  <!-- Music Player Card -->
  <div class="top-player-card">
    <div class="player-info-row">
      <div id="disc-art" class="disc-art">🎵</div>
      <div class="track-meta">
        <span id="song-title-text" class="song-title-text">कानपुरिया डीजे मिक्स...</span>
        <span id="song-artist-text" class="song-artist-text">Kanpuria Roadways DJ</span>
      </div>
    </div>
    <div class="player-buttons">
      <button class="btn-ctrl" onclick="prevSong()">⏮</button>
      <button id="btn-play-main" class="btn-ctrl" style="font-size: 1.5rem;" onclick="togglePlay()">▶</button>
      <button class="btn-ctrl" onclick="nextSong()">⏭</button>
    </div>
  </div>

  <!-- Brand Heading -->
  <div class="brand-heading-hindi">
    कानपुरिया रोडवेज
  </div>

  <!-- Viewport Scenery & Bus -->
  <div class="viewport-scenery">
    <div class="bus-wrapper">
      <div class="headlight-beam"></div>
      <div class="bus-front-name">KANPURIA</div>
      <div class="wheels-container">
        <div class="bus-wheel"></div>
        <div class="bus-wheel"></div>
      </div>
    </div>
    <div class="road-strip">
      <div class="road-dashes-moving"></div>
    </div>
  </div>

  <!-- Hidden Container for YouTube Audio -->
  <div id="yt-hidden-player"></div>

  <div class="vermag-tag">Powered by Kanpuria Express</div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let isPlaying = false;

    // Load YouTube API and Playlist
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-hidden-player', {
        height: '0',
        width: '0',
        playerVars: {
          'listType': 'playlist',
          'list': 'PL4fGSI1pDJn69On1f-yb1ee2f-m2fNff4', // Kanpuria DJ Songs Playlist
          'autoplay': 0,
          'controls': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      document.getElementById('song-title-text').innerText = "गाना बजाने के लिए ▶ दबाएं";
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('btn-play-main').innerText = "⏸";
        document.getElementById('disc-art').classList.add('disc-spinning');
        
        let videoData = player.getVideoData();
        if(videoData && videoData.title) {
          document.getElementById('song-title-text').innerText = videoData.title;
        } else {
          document.getElementById('song-title-text').innerText = "कानपुरिया रोडवेज डीजे बज रहा है 🔥";
        }
      } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
        isPlaying = false;
        document.getElementById('btn-play-main').innerText = "▶";
        document.getElementById('disc-art').classList.remove('disc-spinning');
      }
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function nextSong() {
      if (player && player.nextVideo) {
        player.nextVideo();
      }
    }

    function prevSong() {
      if (player && player.previousVideo) {
        player.previousVideo();
      }
    }

    // Horn Sound System
    function playPoPoHorn() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime); // Horn Pitch
      osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.3);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }
  </script>
</body>
</html>
